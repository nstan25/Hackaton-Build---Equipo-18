# T27 · detección OOD sobre embeddings de la EfficientNet-B0 de producción (experimento, no producción).
# Lo leen scripts/ood/*.py. Artefactos en $BCS_ARTIFACTS_DIR/T27/, reporte en $BCS_RUNS_DIR/T27/.
seed: 0
bank:
  per_group: 5            # frames de sdb_bcs train por group_id en el banco de referencia
  sizes: [2000, 5000, null]   # submuestreos para kNN (null = todo el banco)
knn_k: [1, 5, 10, 50]
val_pipe_per_group: 2     # frames completos de sdb_bcs val por grupo que pasan por filtro + detector
calib_frac: 0.5           # fracción de grupos de val para calibrar z-scores y umbrales
degraded_n: 250           # frames de val por degradación
coco:
  cows: 150               # imágenes de COCO val2017 con vacas (licencias abiertas)
  animals: 100            # caballos, ovejas, perros, etc. sin vacas
  other: 150              # cualquier otra cosa sin animales
  licenses: [4, 5, 6]     # CC BY 2.0, CC BY-SA 2.0, CC BY-ND 2.0
tpr: 0.95
thresholds: [0.95, 0.99]  # percentiles de val ID (calibración) para el umbral propuesto
selective_fractions: [0.0, 0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5]

# T28 · integración en `dev` (G6 opción 1) con el modelo de T25: `python -m bcs.ood.fit_zen`.
# Embeddings con `scripts/ood/build_sets.py --task T28 --weights <weights>`.
integration:
  task: T28
  weights: models/bcs_efficientnet_b0_zen.pt
  artifact: models/ood_mahalanobis_zen.npz
  warn_quantile: 0.99     # aviso: p99 de la mitad de calibración de val, por fuente; el mayor
  reject_margin: 1.25     # rechazo: máximo de todas las vacas reales de val × margen

# T30 · lo mismo para el modelo de grupa: `python -m bcs.ood.fit_zen --section integration_grupa`.
# Embeddings con `scripts/ood/build_sets.py --task T30 --weights <weights>` y
# `scripts/zen_crops/embed_grupa.py --weights <weights>`. En zen, el banco y el val ID son los
# recortes de grupa (vaca sola → detector de producción), lo que ve el modelo en uso real.
integration_grupa:
  task: T30
  weights: models/bcs_efficientnet_b0_zen_grupa.pt
  artifact: models/ood_mahalanobis_zen_grupa.npz
  quality_dir: efficientnet_b0_zen_grupa
  warn_quantile: 0.99
  reject_margin: 1.25
  bank_sets: {sdb_bcs_train: bank, zen_rgbd_train_grupa: bank_zen_grupa}
  bank_rule_zen: "zen_rgbd train (todo, recorte de grupa)"
  val_sets: {sdb_bcs: val_sdb, zen_rgbd: val_zen_grupa}
