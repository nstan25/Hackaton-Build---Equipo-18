# Escala de BCS (SPEC §0.1). `active` se puede pisar con la env var BCS_SCALE.
# collapse_below / collapse_above agrupan las colas con pocos ejemplos (< 15 imágenes):
# los valores por debajo/encima se llevan a ese punto de la grilla.
active: dairy_1_5

presets:
  dairy_1_5:          # Lechería (Holando)
    min: 1.0
    max: 5.0
    step: 0.25
    collapse_below: null
    collapse_above: null
  dairy_sdb:          # G1: dairy_1_5 recortada a lo que trae sdb_bcs (rango validado 3.25–4.25)
    min: 1.0
    max: 5.0
    step: 0.25
    collapse_below: 3.25
    collapse_above: 4.25
  dairy_zen:          # T25 (experimento): sdb_bcs + zen_rgbd; 2.75 se colapsa a 3.0 (solo 10 imágenes)
    min: 1.0
    max: 5.0
    step: 0.25
    collapse_below: 3.0
    collapse_above: 5.0
  beef_1_8:           # Cría vacuna en Uruguay
    min: 1
    max: 8
    step: 1
    collapse_below: null
    collapse_above: null
  beef_1_9:           # Carne (escala NRC/EE.UU.)
    min: 1
    max: 9
    step: 1
    collapse_below: null
    collapse_above: null
