# Escala de BCS (SPEC §0.1). `active` se puede pisar con la env var BCS_SCALE.
# collapse_below / collapse_above agrupan las colas con pocos ejemplos (< 15 imágenes):
# los valores por debajo/encima se llevan a ese punto de la grilla.
active: dairy_1_5

presets:
  dairy_1_5:          # Lechería (Holando)
    min: 1.0
    max: 5.0
    step: 0.25
    collapse_below: null
    collapse_above: null
  beef_1_8:           # Cría vacuna en Uruguay
    min: 1
    max: 8
    step: 1
    collapse_below: null
    collapse_above: null
  beef_1_9:           # Carne (escala NRC/EE.UU.)
    min: 1
    max: 9
    step: 1
    collapse_below: null
    collapse_above: null
