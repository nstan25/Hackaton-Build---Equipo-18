[project]
name = "bcs"
version = "0.1.0"
description = "Estimador de Condición Corporal (BCS) desde fotos traseras de vacas"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "open_clip_torch>=2.26",
    "ultralytics>=8.2",
    "remotezip>=0.12",
    "openpyxl>=3.1",
    "huggingface_hub>=0.24",
    "datasets>=2.20",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcs"]

# torch CPU: local (sin GPU) y Railway corren en CPU. Los backends GPU (T16) instalan su propio torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "preprocesamiento", "SPEC.md", "README.md", "tasks",
    # código del equipo (commit 7cac8ae): fuera del lint
    "make_split.py", "apply_split.py", "prep_crops.py", "prep_yolo.py", "app.py", "baseline_embed.py", "bcs_pipeline.py", "calibrate.py", "metrics.py", "monitor_server.py", "train_cnn.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["preprocesamiento", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
